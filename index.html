<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the preference before styles or React paint the page.
      (() => {
        let preference;
        try { preference = localStorage.getItem("wiki-theme"); } catch { /* Storage may be unavailable. */ }
        const theme = preference === "light" || preference === "dark"
          ? preference
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
      document.documentElement.classList.add("wiki-loader-visible");
    </script>
    <style>
      #site-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1.5rem;
        padding: 1.5rem;
        background: #fff;
        color: #102747;
        font: 600 1rem/1.5 ui-sans-serif, system-ui, sans-serif;
        text-align: center;
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
      }
      .wiki-loader-visible #site-loader {
        visibility: visible;
        opacity: 1;
        pointer-events: auto;
      }
      #site-loader { transition: opacity 200ms ease; }
      .wiki-loader-fading #site-loader { opacity: 0; }
      .wiki-loader-visible body { overflow: hidden; }
      #site-loader-art { display: block; width: min(92vw, 950px); max-height: 65vh; object-fit: contain; }
      #site-loader-retry {
        min-height: 44px;
        padding: .65rem 1.4rem;
        border: 2px solid #102747;
        border-radius: .75rem;
        background: #fff;
        color: #102747;
        font: inherit;
        cursor: pointer;
      }
      #site-loader-retry[hidden] { display: none; }
      #site-loader-retry:focus-visible { outline: 3px solid #d12f35; outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) {
        #site-loader { transition: none; }
        }
    </style>
    <link
      rel="shortcut icon"
      href="https://static.igem.wiki/common/icons/favicons/igem-2022.svg"
      type="image/x-icon"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Worldshaper-Nanjing's 2026 iGEM wiki for the Strength Over Time project."
    />
    <meta name="theme-color" content="#071a35" />
    <title>Worldshaper-Nanjing | iGEM 2026</title>
  </head>
  <body>
    <div id="site-loader" role="status" aria-live="polite" aria-label="Loading website">
      <canvas id="site-loader-art" width="1754" height="716" aria-hidden="true"></canvas>
      <span id="site-loader-message">Loading website…</span>
      <button id="site-loader-retry" type="button" hidden>Retry</button>
    </div>
    <div id="root" inert></div>
    <script src="%BASE_URL%loader.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

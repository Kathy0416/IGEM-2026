<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the preference before styles or React paint the page.
      (() => {
        let preference;
        try { preference = localStorage.getItem("wiki-theme"); } catch { /* Storage may be unavailable. */ }
        const theme = preference === "light" || preference === "dark"
          ? preference
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link
      rel="shortcut icon"
      href="https://static.igem.wiki/common/icons/favicons/igem-2022.svg"
      type="image/x-icon"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Worldshaper-Nanjing's 2026 iGEM wiki for the Strength Over Time project."
    />
    <meta name="theme-color" content="#071a35" />
    <title>Worldshaper-Nanjing | iGEM 2026</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
